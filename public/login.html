<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="login.css">
  <title>Login Page</title>
</head>
<body>
  <div id="login-container">
    <h1 id="title">Welcome Back!</h1>
    <p id="subtitle">We're so excited to see you again!</p>
    <form id="login-form" autocomplete="off">
      <input id="username_input" name="username" type="text" placeholder="Username" autocomplete="off" required>
      <input id="password_input" name="password" type="password" placeholder="Password" autocomplete="new-password" required>
      <input id="login-button" type="submit" value="Log In">
    </form>
  </div>
</body>
<script src="login.js"></script>
</html>
